<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Shopping Cart</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Practical 05</p>
      <h1>Modular Shopping Cart</h1>
      <p>Complete <code>cart.js</code>. The catalogue and browser UI are ready.</p>
    </header>

    <section aria-labelledby="catalogue-title">
      <h2 id="catalogue-title">Catalogue</h2>
      <div class="catalogue" id="catalogue"></div>
    </section>

    <section class="cart-panel" aria-labelledby="cart-title">
      <div class="section-heading">
        <h2 id="cart-title">Cart</h2>
        <label>Promo code <input id="promo" placeholder="STUDENT10"></label>
      </div>
      <p class="message" id="message" role="status"></p>
      <div id="cart"></div>
      <dl class="summary" id="summary"></dl>
    </section>
  </main>
  <script type="module" src="./cart-ui.js"></script>
</body>
</html>
